# /var/ossec/wodles/wazuh-ti/config.ini
# Конфигурация wazuh-ti-updater. Комментарии: строки с # (в конце значения # тоже допустим).
#
# РАЗМЕЩЕНИЕ В PODMAN. Все пути ниже лежат в постоянных томах контейнера Wazuh Manager
# (wazuh-docker, single-node): /var/ossec/etc, /var/ossec/logs и /var/ossec/wodles. Они переживают
# podman restart и пересоздание контейнера (podman-compose down / up без ключа -v).
# НЕ используйте для данных /usr/local/sbin, /etc/wazuh-ti и /var/lib/wazuh-ti: эти каталоги
# находятся в слое контейнера и пропадают при его пересоздании.
# Для установки без контейнера (Wazuh на хосте) пути и юниты systemd см. в contrib/baremetal/.

[general]
# Каталог CDB-списков Wazuh (в ossec.conf пути указываются относительно /var/ossec: etc/lists/...)
lists_dir = /var/ossec/etc/lists
# Рабочий каталог: история last-seen, бэкапы, status.json, lock-файл
state_dir = /var/ossec/wodles/wazuh-ti/state
log_file = /var/ossec/logs/wazuh-ti-updater.log

# Файл с бесплатным Auth-Key abuse.ch (одна строка, права 0600, владелец root).
# Ключ подставляется в URL вместо маркера {AUTH_KEY} и маскируется в журнале.
# Сам ключ в проект и в архив не входит: создайте файл по README (шаг 2).
auth_key_file = /var/ossec/wodles/wazuh-ti/abusech.key
# Исключения: домены (точное совпадение), которые никогда не попадут в списки
allowlist_file = /var/ossec/wodles/wazuh-ti/allowlist.txt

# Группа и права итоговых списков (как у остальных файлов в etc/lists)
owner_group = wazuh
file_mode = 0660

# Имена итоговых списков
merged_list = ti-domains     # все домены: domain:Источник1,Источник2
multi_list = ti-multi        # домены, найденные минимум в двух источниках

keep_backups = 7             # сколько последних бэкапов списков хранить
http_timeout = 60            # секунд на запрос
http_retries = 3
max_download_mb = 300        # лимит размера ответа

# Если источник недоступен, его IOC берутся из истории за max(retention_days, fallback_days) суток
fallback_days = 3

# Защита от пустых/обрезанных ответов: если список (от min_shrink_base записей и больше)
# сокращается более чем на max_shrink_percent процентов, обновление прерывается.
max_shrink_percent = 60
min_shrink_base = 500

# false: при недоступном источнике без резервных данных обновление НЕ выполняется
allow_partial = false

# Проверка конфигурации Wazuh после замены списков (при ошибке выполняется откат).
# Пустое значение отключает проверку.
validate_command = /var/ossec/bin/wazuh-analysisd -t
# Применение без полного рестарта. Пустое значение отключает reload.
# Работа reload внутри контейнера проверяется по README (раздел «Проверка применения списков»).
reload_command = /var/ossec/bin/wazuh-control reload
command_timeout = 300

user_agent = wazuh-ti-updater/1.1


# ---------------------------------------------------------------------------
# Источники. label попадает в значение CDB и в описания правил (буквы, цифры, _ и -).
# retention_days: сколько суток хранить IOC после последнего появления в фиде
# (0 - только то, что есть в сегодняшнем фиде).
# ---------------------------------------------------------------------------
[source:urlhaus]
enabled = true
label = URLhaus
list = ti-urlhaus
order = 1
retention_days = 14
min_entries = 50

[source:threatfox]
enabled = true
label = ThreatFox
list = ti-threatfox
order = 2
retention_days = 30
min_entries = 20

[source:phishingarmy]
enabled = true
label = PhishingArmy
list = ti-phishingarmy
order = 3
retention_days = 7
min_entries = 1000


# ---------------------------------------------------------------------------
# Фиды. parser: hostfile | plain | csv_url | csv_ioc. compression: none | zip.
# required=true: при ошибке такого фида источник считается деградировавшим.
#
# ВАЖНО про abuse.ch: с 2025 года для скачивания нужен бесплатный Auth-Key
# (https://auth.abuse.ch/). Ключ вставляется в URL через маркер {AUTH_KEY}.
# Имена файлов recent.csv (URLhaus) и full.csv.zip (ThreatFox) приведены в
# документации abuse.ch. Имя hostfile.txt построено по тому же шаблону экспортов:
# проверьте точную ссылку в вашем кабинете на страницах Export/API и при
# необходимости исправьте url. Поэтому hostfile-фиды помечены required = false.
# ---------------------------------------------------------------------------
[feed:urlhaus-hostfile]
source = urlhaus
url = https://urlhaus-api.abuse.ch/v2/files/exports/{AUTH_KEY}/hostfile.txt
parser = hostfile
auth = abusech
required = false

[feed:urlhaus-csv]
source = urlhaus
url = https://urlhaus-api.abuse.ch/v2/files/exports/{AUTH_KEY}/recent.csv
parser = csv_url
auth = abusech
required = true

[feed:threatfox-hostfile]
source = threatfox
url = https://threatfox-api.abuse.ch/v2/files/exports/{AUTH_KEY}/hostfile.txt
parser = hostfile
auth = abusech
required = false

[feed:threatfox-csv]
source = threatfox
url = https://threatfox-api.abuse.ch/v2/files/exports/{AUTH_KEY}/full.csv.zip
parser = csv_ioc
compression = zip
auth = abusech
required = true

[feed:phishingarmy-domains]
source = phishingarmy
url = https://phishing.army/download/phishing-army-domains.txt
parser = plain
required = true
min_entries = 1000
